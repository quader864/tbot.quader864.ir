<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futuristic Undulating 3D Point-Cloud Orb | Web Worker + OffscreenCanvas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040714; /* Dark, deep navy void background */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f1f5f9;
      user-select: none;
    }

    /* Full-screen canvas */
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Minimalist Floating HUD */
    .hud-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hud-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
    }

    .hud-subtitle {
      font-size: 12px;
      font-family: monospace;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    .hud-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-family: monospace;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      color: #38bdf8;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .badge.error {
      color: #f87171;
    }
    .badge.error::before {
      background: #f87171;
      box-shadow: 0 0 8px #f87171;
    }

    /* Bottom Control Bar */
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(10, 16, 32, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #cbd5e1;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 120px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00e5ff;
    }
  </style>
</head>
<body>
  <!-- WebGL Render Canvas transferred to Worker -->
  <canvas id="webgl-canvas"></canvas>

  <!-- HUD Overlay -->
  <div class="hud-overlay">
    <div class="hud-title">3D Bioluminescent Point-Cloud Orb</div>
    <div class="hud-subtitle">16,384 Vertices · GPU Simplex Wave Displacement · OffscreenCanvas</div>
    <div class="hud-badge-row">
      <div id="status-badge" class="badge">Initializing Worker...</div>
      <div class="badge">Main Thread: <span id="fps-counter" style="margin-left:4px; font-weight:bold;">-- FPS</span></div>
    </div>
  </div>

  <!-- Bottom Interactive Speed Control -->
  <div class="controls-panel">
    <div class="control-group">
      <label for="speed-slider">Wave Ripple Speed:</label>
      <input type="range" id="speed-slider" min="0.1" max="2.5" step="0.05" value="0.8" />
    </div>
  </div>

  <!-- Main Thread Entry Point -->
  <script type="module" src="main.js"></script>
</body>
</html>
